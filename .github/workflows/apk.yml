name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar app
        run: |
          mkdir -p www && cp site/index.html site/icon-192.png site/icon-512.png www/
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Tita e o Coral" com.claude.titacoral --web-dir www
          npx cap add android
          npx cap sync android
          # tela sempre deitada e em tela cheia
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          grep -q sensorLandscape android/app/src/main/AndroidManifest.xml
          sed -i 's#<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">#&\n        <item name="android:windowFullscreen">true</item>#' android/app/src/main/res/values/styles.xml || true
          # ícone do app
          for d in android/app/src/main/res/mipmap-*; do cp site/icon-192.png $d/ic_launcher.png; cp site/icon-192.png $d/ic_launcher_round.png; cp site/icon-192.png $d/ic_launcher_foreground.png 2>/dev/null || true; done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Compilar APK
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../TitaCoral.apk
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Tita e o Coral Brilhante v${{ github.run_number }}
          files: TitaCoral.apk
