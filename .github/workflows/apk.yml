name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar pacotes (Expo + React Native)
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix || true
      - name: Conferir o TypeScript
        run: npx tsc --noEmit
      - name: Gerar o projeto Android
        run: |
          node scripts/build-game.mjs
          npx expo prebuild -p android --no-install --clean
          # mesma assinatura do app antigo: instala por cima e mantém o progresso
          cp ../android-key/debug.keystore android/app/debug.keystore
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode\|signingConfig" android/app/build.gradle | head
      - name: Compilar APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          cp app/build/outputs/apk/release/app-release.apk ../../TitaCoral.apk
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Tita e o Coral Brilhante v${{ github.run_number }} (Expo)
          files: TitaCoral.apk
