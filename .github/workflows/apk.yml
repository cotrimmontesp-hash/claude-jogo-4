name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar pacotes (Expo + React Native)
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix || true
      - name: Conferir o TypeScript
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Gerar o projeto Android
        run: |
          npx expo prebuild -p android --no-install --clean
          # mesma assinatura do app antigo: instala por cima
          cp ../android-key/debug.keystore android/app/debug.keystore
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode\|signingConfig" android/app/build.gradle | head
      - name: Compilar APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
          cp app/build/outputs/apk/release/app-release.apk ../../TitaCoral.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: TitaCoral.apk
      - name: Publicar APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Tita e o Coral Brilhante v${{ github.run_number }}
          files: TitaCoral.apk
  teste:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Ligar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Testar no emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          script: |
            mkdir -p shots; adb install -r TitaCoral.apk; adb logcat -c; adb shell monkey -p com.claude.titacoral -c android.intent.category.LAUNCHER 1; sleep 30; adb exec-out screencap -p > shots/1-inicio.png; adb shell wm size > shots/size.txt; S=$(adb shell wm size | grep -o '[0-9]*x[0-9]*' | tail -1); A=${S%x*}; B=${S#*x}; if [ $A -gt $B ]; then WW=$A; HH=$B; else WW=$B; HH=$A; fi; echo $WW $HH >> shots/size.txt; adb shell input tap $((WW*84/100)) $((HH*15/100)); sleep 5; adb exec-out screencap -p > shots/2-dialogo.png; adb shell input tap $((WW*97/100)) $((HH*7/100)); sleep 5; adb exec-out screencap -p > shots/3-jogo.png; adb shell input swipe $((WW*20/100)) $((HH*75/100)) $((WW*30/100)) $((HH*75/100)) 1500; adb exec-out screencap -p > shots/4-andando.png; adb logcat -d > shots/logcat.txt; true
      - name: Guardar fotos do teste
        if: always()
        run: |
          cd shots || exit 0
          grep -E "ReactNativeJS|AndroidRuntime|FATAL" logcat.txt | tail -300 > log-js.txt || true
          rm -f logcat.txt
          git init -q; git checkout -q -b ci-shots; git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "fotos do teste ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots
